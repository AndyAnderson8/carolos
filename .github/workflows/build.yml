name: Build exe

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CarolAIO
          path: dist/CarolAIO.exe
