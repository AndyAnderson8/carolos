[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
platform = "win32"
strict = true
files = ["carol_aio", "tests", "main.py", "build.py"]

[[tool.mypy.overrides]]
module = ["pycaw.*", "comtypes.*", "PyInstaller.*", "pystray.*"]
ignore_missing_imports = true
